      background: #f4f7fb;
      color: #172033;
    }
    .wrap { width: min(1100px, calc(100% - 32px)); margin: 48px auto; }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .lead { margin: 0 0 24px; color: #68738a; line-height: 1.7; }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 420px) minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }
    .card {
      background: #fff;
      border: 1px solid #dfe5ee;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(30,41,59,.08);
    }
    .card-head { padding: 18px 22px; border-bottom: 1px solid #dfe5ee; }
    .card-head h2 { margin: 0; font-size: 18px; }
    .card-body { padding: 22px; }
    .field { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid #dfe5ee;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 4px rgba(37,99,235,.1); }
    .filename-input {
      display: flex;
      align-items: stretch;
    }
    .filename-input input {
      min-width: 0;
      border-radius: 10px 0 0 10px;
    }
    .extension {
      display: flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid #dfe5ee;
      border-left: 0;
      border-radius: 0 10px 10px 0;
      background: #eef2f7;
      color: #475569;
      font-weight: 700;
      user-select: none;
    }
    .hint { display: block; margin-top: 7px; color: #68738a; font-size: 12px; line-height: 1.5; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 10px; padding: 12px 16px;
      font: inherit; font-weight: 700; cursor: pointer;
    }
    .primary { background: #2563eb; color: #fff; }
    .secondary { background: #eef2f7; color: #172033; }
    .status { min-height: 22px; margin-top: 14px; font-size: 13px; font-weight: 700; }
    .error { color: #c2410c; }
    .ok { color: #047857; }
    textarea {
      display: block;
      width: 100%;
      min-height: 610px;
      padding: 18px;
      border: 0;
      resize: vertical;
      outline: 0;
      background: #0f172a;
      color: #dbeafe;
      font-family: Consolas, "SFMono-Regular", monospace;
      font-size: 12px;
      line-height: 1.65;
      white-space: pre;
    }
    .preview-note { padding: 12px 20px; color: #68738a; font-size: 12px; background: #fafbfd; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      textarea { min-height: 420px; }
    }
  </style>
</head>

            <button id="downloadBtn" class="primary" type="button">HTMLをダウンロード</button>
            <button id="resetBtn" class="secondary" type="button">初期値に戻す</button>
          </div>

          <div id="status" class="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>生成HTMLプレビュー</h2></div>
        <textarea id="preview" spellcheck="false" readonly></textarea>
        <div class="preview-note">入力内容を変更すると自動更新されます。</div>
      </section>
    </div>
  </main>

function decodeTemplate() {
  const binary = atob(TEMPLATE_BASE64);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}

const originalTemplate = decodeTemplate();

const fileName = document.getElementById("fileName");
const publishDate = document.getElementById("publishDate");
const maintenanceDateTime = document.getElementById("maintenanceDateTime");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

function normalizeFileName(value) {
  let name = value.trim();
  if (!name) return "";
  name = name.replace(/\.html$/i, "");
  return name + ".html";
}

function formatPublishDate(value) {
  if (!value) return "";
  const parts = value.split("-");
  return Number(parts[0]) + "/" + Number(parts[1]) + "/" + Number(parts[2]);
}

function buildHtml() {
  const outputName = normalizeFileName(fileName.value);
  const dateText = formatPublishDate(publishDate.value);
  const maintenanceText = maintenanceDateTime.value.trim();

  let output = originalTemplate;

  if (outputName) {
    const newUrl = "hdummy/business/information/detail/" + outputName;

    output = output.replace(
      'content="hdummy/business/information/detail/20260901.html"',
      'content="' + newUrl + '"'
    );

    output = output.replace(
      'href="hdummy/business/information/detail/20260901.html"',
      'href="' + newUrl + '"'
    );
  }

  if (dateText) {
    output = output.replace(
      '<div class="c-news-date -new">2026/9/1</div>',
      '<div class="c-news-date -new">' + dateText + '</div>'
    );
  }

  if (maintenanceText) {
    output = output.replace(
      '            2026年9月8日(火) 16:00 ～ 22:00',
      '            ' + maintenanceText
    );
  }

  preview.value = output;
  return output;
}

function validate() {
  status.className = "status";

  if (!fileName.value.trim()) {
    status.textContent = "ファイル名を入力してください。";
    status.classList.add("error");
    return false;
  }
  if (!publishDate.value) {
    status.textContent = "お知らせ掲載日を入力してください。";
    status.classList.add("error");
    return false;
  }
  if (!maintenanceDateTime.value.trim()) {
    status.textContent = "メンテナンス日時を入力してください。";
    status.classList.add("error");
    return false;
  }

  status.textContent = "";
  return true;
}

function downloadHtml() {
  if (!validate()) return;

  const output = buildHtml();
  const outputName = normalizeFileName(fileName.value);
  const blob = new Blob([output], { type: "text/html;charset=utf-8" });
  const blobUrl = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = blobUrl;
  link.download = outputName;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

  status.textContent = outputName + " を生成しました。";
  status.className = "status ok";
}

function resetForm() {
  fileName.value = "20260901";
  publishDate.value = "2026-09-01";
  maintenanceDateTime.value = "2026年9月8日(火) 16:00 ～ 22:00";
  status.textContent = "";
  status.className = "status";
  buildHtml();
}

[fileName, publishDate, maintenanceDateTime].forEach(el => {
  el.addEventListener("input", buildHtml);
  el.addEventListener("change", buildHtml);
});

document.getElementById("downloadBtn").addEventListener("click", downloadHtml);
document.getElementById("resetBtn").addEventListener("click", resetForm);

buildHtml();
</script>
</body>
</html>
