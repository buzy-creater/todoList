<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公開前セルフチェックシート</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --warning: #b45309;
      --warning-soft: #fffbeb;
      --danger: #b42318;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.08), transparent 35%),
        linear-gradient(180deg, #f8fbff 0%, var(--bg) 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(980px, calc(100% - 32px));
      margin: 48px auto;
    }

    .hero {
      margin-bottom: 24px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding: 7px 11px;
      border: 1px solid #dbeafe;
      border-radius: 999px;
      color: var(--primary);
      background: rgba(239, 246, 255, 0.9);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    .lead {
      max-width: 760px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      overflow: hidden;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      padding: 24px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, #fff, #fbfdff);
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #475467;
    }

    .segment {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 5px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
    }

    .segment input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segment label {
      margin: 0;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s ease;
      user-select: none;
    }

    .segment input:checked + label {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.24);
    }

    .reset-button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 14px;
      background: #fff;
      color: #475467;
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .reset-button:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
      transform: translateY(-1px);
    }

    .progress-wrap {
      padding: 22px 24px 0;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-title {
      font-size: 14px;
      font-weight: 800;
    }

    .progress-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #e9eef5;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      transition: width 0.28s ease;
    }

    .status {
      margin: 18px 24px 0;
      padding: 14px 16px;
      border: 1px solid #fde68a;
      border-radius: var(--radius-md);
      color: var(--warning);
      background: var(--warning-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .status.complete {
      border-color: #bbf7d0;
      color: var(--success);
      background: var(--success-soft);
    }

    .content {
      padding: 24px;
    }

    .section {
      margin-top: 24px;
    }

    .section:first-child {
      margin-top: 0;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .section-icon {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 900;
    }

    .section h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .subheading {
      margin: 20px 0 10px;
      color: #475467;
      font-size: 13px;
      font-weight: 800;
      text-transform: none;
    }

    .check-list {
      display: grid;
      gap: 10px;
    }

    .check-item {
      position: relative;
    }

    .check-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .check-label {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 12px;
      align-items: start;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .check-label:hover {
      border-color: #bfdbfe;
      background: #fbfdff;
      transform: translateY(-1px);
    }

    .fake-check {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      margin-top: 1px;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      color: transparent;
      background: #fff;
      font-size: 15px;
      font-weight: 900;
      transition: 0.2s ease;
    }

    .check-item input:checked + .check-label {
      border-color: #bfdbfe;
      background: var(--primary-soft);
    }

    .check-item input:checked + .check-label .fake-check {
      border-color: var(--primary);
      color: #fff;
      background: var(--primary);
    }

    .check-text {
      line-height: 1.65;
      font-size: 14px;
    }

    .note {
      margin-top: 10px;
      padding: 13px 15px;
      border-radius: 12px;
      color: #475467;
      background: #f8fafc;
      font-size: 13px;
      line-height: 1.7;
    }

    .note code {
      color: #1d4ed8;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: 700;
    }

    [hidden] {
      display: none !important;
    }

    .footer-note {
      margin-top: 18px;
      color: #98a2b3;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 700px) {
      .app {
        width: min(100% - 20px, 980px);
        margin: 24px auto;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .segment {
        display: grid;
        width: 100%;
      }

      .segment label {
        text-align: center;
      }

      .reset-button {
        width: 100%;
      }

      .content,
      .toolbar,
      .progress-wrap {
        padding-left: 18px;
        padding-right: 18px;
      }

      .status {
        margin-left: 18px;
        margin-right: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="eyebrow">Wチェック前のセルフ確認</div>
      <h1>公開前セルフチェックシート</h1>
      <p class="lead">
        公開作業に進む前に、担当者自身で必要書類・証跡・公開内容・公開対象を確認するためのチェックシートです。
        Wチェックの代替ではなく、Wチェック依頼前の確認漏れ防止を目的としています。
      </p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="field">
          <label>公開方法</label>
          <div class="segment" role="radiogroup" aria-label="公開方法">
            <input type="radio" name="publishType" id="sitecore" value="sitecore" checked>
            <label for="sitecore">SITECORE</label>

            <input type="radio" name="publishType" id="azure" value="azure">
            <label for="azure">AzureDevOps</label>
          </div>
        </div>

        <button type="button" class="reset-button" id="resetButton">チェックをリセット</button>
      </div>

      <div class="progress-wrap">
        <div class="progress-head">
          <div class="progress-title">進捗</div>
          <div class="progress-count" id="progressCount">0 / 0 完了</div>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="status" id="statusMessage" aria-live="polite"></div>

      <div class="content">
        <section class="section">
          <div class="section-header">
            <div class="section-icon">✓</div>
            <h2>共通</h2>
          </div>

          <div class="subheading">必要書類・証跡</div>
          <div class="check-list">
            <div class="check-item">
              <input type="checkbox" id="common-1" data-scope="common">
              <label class="check-label" for="common-1">
                <span class="fake-check">✓</span>
                <span class="check-text">BOX内に依頼元からの依頼書が格納されている</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="common-2" data-scope="common">
              <label class="check-label" for="common-2">
                <span class="fake-check">✓</span>
                <span class="check-text">BOX内に広告審査の証跡が格納されている</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="common-3" data-scope="common">
              <label class="check-label" for="common-3">
                <span class="fake-check">✓</span>
                <span class="check-text">BOXに決裁証跡が格納されている（原稿の雛形利用掲載時はABK決裁が必要）</span>
              </label>
            </div>
          </div>

          <div class="subheading">公開内容</div>
          <div class="check-list">
            <div class="check-item">
              <input type="checkbox" id="common-4" data-scope="common">
              <label class="check-label" for="common-4">
                <span class="fake-check">✓</span>
                <span class="check-text">校了原稿と公開予定ページの内容に差異がない</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="common-5" data-scope="common">
              <label class="check-label" for="common-5">
                <span class="fake-check">✓</span>
                <span class="check-text">依頼元によるテストアップ確認が完了している</span>
              </label>
            </div>
          </div>
        </section>

        <section class="section" id="sitecoreSection">
          <div class="section-header">
            <div class="section-icon">S</div>
            <h2>Sitecore</h2>
          </div>

          <div class="check-list">
            <div class="check-item">
              <input type="checkbox" id="sitecore-1" data-scope="sitecore">
              <label class="check-label" for="sitecore-1">
                <span class="fake-check">✓</span>
                <span class="check-text">公開対象となるアイテムリストを作成した</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="sitecore-2" data-scope="sitecore">
              <label class="check-label" for="sitecore-2">
                <span class="fake-check">✓</span>
                <span class="check-text">公開対象アイテム・バージョンに漏れ・誤りがない</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="sitecore-3" data-scope="sitecore">
              <label class="check-label" for="sitecore-3">
                <span class="fake-check">✓</span>
                <span class="check-text">更新対象アイテムに「バージョン + 案件バックログURL」を記載した</span>
              </label>
            </div>
          </div>

          <div class="note">
            記載例：<code>ver26 https://～</code>
          </div>
        </section>

        <section class="section" id="azureSection" hidden>
          <div class="section-header">
            <div class="section-icon">A</div>
            <h2>Azure DevOps</h2>
          </div>

          <div class="check-list">
            <div class="check-item">
              <input type="checkbox" id="azure-1" data-scope="azure">
              <label class="check-label" for="azure-1">
                <span class="fake-check">✓</span>
                <span class="check-text">公開対象となるファイルリストを作成した</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="azure-2" data-scope="azure">
              <label class="check-label" for="azure-2">
                <span class="fake-check">✓</span>
                <span class="check-text">公開対象ファイルに漏れ・誤りがない</span>
              </label>
            </div>

            <div class="check-item">
              <input type="checkbox" id="azure-3" data-scope="azure">
              <label class="check-label" for="azure-3">
                <span class="fake-check">✓</span>
                <span class="check-text">本番公開の作業予約が完了している</span>
              </label>
            </div>
          </div>
        </section>
      </div>
    </section>

    <p class="footer-note">チェック状態と公開方法はこのブラウザ内に自動保存されます。</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'prePublishSelfCheck_v1';
      const publishTypeInputs = [...document.querySelectorAll('input[name="publishType"]')];
      const checkboxes = [...document.querySelectorAll('input[type="checkbox"]')];
      const sitecoreSection = document.getElementById('sitecoreSection');
      const azureSection = document.getElementById('azureSection');
      const progressCount = document.getElementById('progressCount');
      const progressBar = document.getElementById('progressBar');
      const statusMessage = document.getElementById('statusMessage');
      const resetButton = document.getElementById('resetButton');

      function getPublishType() {
        return publishTypeInputs.find(input => input.checked)?.value || 'sitecore';
      }

      function getActiveCheckboxes() {
        const type = getPublishType();
        return checkboxes.filter(box => {
          const scope = box.dataset.scope;
          return scope === 'common' || scope === type;
        });
      }

      function saveState() {
        const state = {
          publishType: getPublishType(),
          checks: Object.fromEntries(checkboxes.map(box => [box.id, box.checked]))
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;

        try {
          const state = JSON.parse(raw);

          if (state.publishType) {
            const target = publishTypeInputs.find(input => input.value === state.publishType);
            if (target) target.checked = true;
          }

          if (state.checks) {
            checkboxes.forEach(box => {
              if (Object.prototype.hasOwnProperty.call(state.checks, box.id)) {
                box.checked = Boolean(state.checks[box.id]);
              }
            });
          }
        } catch (error) {
          console.warn('保存データの読み込みに失敗しました。', error);
        }
      }

      function updateSections() {
        const type = getPublishType();
        sitecoreSection.hidden = type !== 'sitecore';
        azureSection.hidden = type !== 'azure';
      }

      function updateProgress() {
        const active = getActiveCheckboxes();
        const completed = active.filter(box => box.checked).length;
        const total = active.length;
        const remaining = total - completed;
        const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

        progressCount.textContent = `${completed} / ${total} 完了`;
        progressBar.style.width = `${percent}%`;

        if (remaining === 0 && total > 0) {
          statusMessage.textContent = '公開前セルフチェックがすべて完了しました。Wチェックへ進めます。';
          statusMessage.classList.add('complete');
        } else {
          statusMessage.textContent = `未確認の項目が ${remaining} 件あります。`;
          statusMessage.classList.remove('complete');
        }
      }

      function refresh() {
        updateSections();
        updateProgress();
        saveState();
      }

      publishTypeInputs.forEach(input => {
        input.addEventListener('change', refresh);
      });

      checkboxes.forEach(box => {
        box.addEventListener('change', () => {
          updateProgress();
          saveState();
        });
      });

      resetButton.addEventListener('click', () => {
        const active = getActiveCheckboxes();
        active.forEach(box => box.checked = false);
        updateProgress();
        saveState();
      });

      loadState();
      updateSections();
      updateProgress();
    })();
  </script>
</body>
</html>
